<div id="taskDetailsModal" class="upload-modal-overlay">

      </div>
  
      <div class="upload-modal-actions">
        <button type="button" class="btn-submit-upload" onclick="openUploadFromDetails()">رفع الملف الآن</button>
        <button type="button" class="btn-cancel-upload" onclick="closeModal('taskDetailsModal')">إغلاق</button>

  <script>
    let currentTab = 'active';
    let allAssignments = [];

    // Parse URL params (e.g. ?tab=active&id=xxx)
    const urlParams = new URLSearchParams(window.location.search);
    const initialTab = urlParams.get('tab') || 'active';
    const targetId = urlParams.get('id') || '';

    function switchTab(tabType) {
      currentTab = tabType;
      document.getElementById('tabActiveBtn').classList.toggle('active', tabType === 'active');
      document.getElementById('tabArchivedBtn').classList.toggle('active', tabType === 'archived');
      renderHubAssignments();
    }

    async function loadHubAssignments() {
      const container = document.getElementById('assignmentsHubContainer');
      try {
        let snapshot = await db.collection('assignments').get();
        if (!snapshot.empty) {
          allAssignments = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        } else {
          // Fallback to local JSON if Firestore is empty
          const res = await fetch('data/archive.json');
          const data = await res.json();
          allAssignments = data.assignments || [];
        }
        
        switchTab(initialTab);

        // If specific assignment ID was passed in URL, auto-open submit modal for active tasks
        if (targetId && initialTab === 'active') {
          openSubmitModal(targetId);
        }
      } catch (err) {
        console.error("Error loading hub assignments:", err);
        container.innerHTML = '<p style="text-align:center; color:#ef4444;">حدث خطأ في تحميل بيانات الواجبات</p>';
      }
    }

    function renderHubAssignments() {
  const container = document.getElementById('assignmentsHubContainer');
  if (!container) return;

  const now = new Date();
  const filtered = allAssignments.filter(item => {
    let dueDate = item.dueDate?.toDate ? item.dueDate.toDate() : new Date(item.dueDate || Date.now() + 86400000);
    return currentTab === 'active' ? (dueDate > now) : (dueDate <= now);
  });

  if (filtered.length === 0) {
    container.innerHTML = `<p style="text-align:center; color:#94a3b8; padding: 32px 0;">لا توجد واجبات في قسم ${currentTab === 'active' ? 'الواجبات النشطة' : 'الأرشيف المكتمل'} حالياً</p>`;
    return;
  }

  container.innerHTML = '';
  filtered.forEach(task => {
    let dueDate = task.dueDate?.toDate ? task.dueDate.toDate() : new Date(task.dueDate || Date.now() + 86400000);
    const formattedDate = dueDate.toLocaleDateString('ar-EG', { day: 'numeric', month: 'short', year: 'numeric' });
    const diffTime = Math.abs(dueDate - now);
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

    if (currentTab === 'active') {
      const card = document.createElement('div');
      card.className = 'assignment-card active-blue-card';
      card.onclick = () => openSubmitModal(task.id); // Clicking card triggers submission modal

      card.innerHTML = `
        <div class="assignment-right-wrapper">
          <div class="assignment-right-info">
            <h3 class="assignment-title">${task.title}</h3>
            <p class="assignment-meta">مادة ${task.subject || task.author || 'المقرر'} • الموعد النهائي: ${formattedDate}</p>
          </div>

          <!-- Info Icon PNG -->
          <button type="button" class="btn-info-icon" onclick="event.stopPropagation(); openTaskDetailsModal('${task.id}')" title="تفاصيل الواجب">
            <img src="assets/images/web/active_info.png" alt="info" class="info-icon-img">
          </button>
        </div>

        <!-- White Countdown Box -->
        <div class="assignment-left-whitebox" title="انقر لتسليم الواجب">
          <img src="assets/images/web/clock_icon.png" alt="timer" class="stopwatch-img">
          <div class="timer-text-wrapper">
            <span class="timer-text-simple">[${diffDays} أيام]</span>
            <span class="timer-text-detailed" data-duedate="${dueDate.toISOString()}">00d:00h:00m:00s</span>
          </div>
        </div>
      `;
      container.appendChild(card);
    } else {
      const card = document.createElement('div');
      card.className = 'assignment-card archived-white-card';
      card.innerHTML = `
        <div class="assignment-right-info" style="padding: 16px 20px;">
          <h3 class="assignment-title dark-text">${task.title}</h3>
          <p class="assignment-meta muted-text">مادة ${task.subject || task.author || 'المقرر'} • انتهى الموعد (${formattedDate})</p>
        </div>
        <div class="assignment-left-actions" style="padding-left: 20px;">
          <button type="button" class="btn-info-icon" onclick="openTaskDetailsModal('${task.id}')" title="عرض التفاصيل">
            <img src="assets/images/web/archive_info.png" alt="info" class="info-icon-img">
          </button>
          <span class="archived-date-stamp">مكتمل</span>
        </div>
      `;
      container.appendChild(card);
    }
  });

  startHubCountdowns();
}

// Live Countdown Timer for Dashboard Page
let hubCountdownInterval = null;
function startHubCountdowns() {
  if (hubCountdownInterval) clearInterval(hubCountdownInterval);

  hubCountdownInterval = setInterval(() => {
    const detailedElements = document.querySelectorAll('.timer-text-detailed');
    const now = new Date().getTime();

    detailedElements.forEach(el => {
      const rawDueDate = el.getAttribute('data-duedate');
      if (!rawDueDate) return;

      const targetTime = new Date(rawDueDate).getTime();
      const distance = targetTime - now;

      if (distance < 0) {
        el.textContent = '00d:00h:00m:00s';
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      const dStr = String(days).padStart(2, '0');
      const hStr = String(hours).padStart(2, '0');
      const mStr = String(minutes).padStart(2, '0');
      const sStr = String(seconds).padStart(2, '0');

      el.textContent = `${dStr}d:${hStr}h:${mStr}m:${sStr}s`;
    });
  }, 1000);
}

let currentSelectedTask = null;

function openTaskDetailsModal(taskId) {
  const task = allAssignments.find(t => String(t.id) === String(taskId));
  if (!task) return;

  currentSelectedTask = task;
  document.getElementById('detailTaskTitle').textContent = task.title;
  document.getElementById('detailTaskMeta').textContent = `مادة ${task.subject || task.author || ''}`;
  document.getElementById('detailTaskInstructions').textContent = task.instructions || task.meta || 'يرجى رفع إجابة البحث بالصيغة المطلوبة قبل انتهاء الموعد المحدد.';

  document.getElementById('taskDetailsModal').classList.add('show');
}

function openUploadFromDetails() {
  closeModal('taskDetailsModal');
  if (currentSelectedTask) openSubmitModal(currentSelectedTask.id);
}

function closeModal(modalId) {
  const m = document.getElementById(modalId);
  if (m) m.classList.remove('show');
}



    function openSubmitModal(taskId) {
      const task = allAssignments.find(t => String(t.id) === String(taskId));
      if (!task) return;

      document.getElementById('selectedAssignmentId').value = task.id;
      document.getElementById('modalTaskTitle').textContent = `تسليم: ${task.title}`;
      document.getElementById('modalTaskSub').textContent = `مادة ${task.subject || task.author || 'المقرر'}`;
      document.getElementById('submitModal').classList.add('show');
    }

    function closeSubmitModal() {
      document.getElementById('submitModal').classList.remove('show');
      document.getElementById('submissionForm').reset();
      document.getElementById('fileInputText').innerHTML = 'اضغط هنا لاختيار <b>ملف الواجب</b>';
    }

    function updateFileName(input) {
      if (input.files && input.files[0]) {
        document.getElementById('fileInputText').innerHTML = `الملف المحدد: <b>${input.files[0].name}</b>`;
      }
    }

    async function handleAssignmentSubmit(e) {
  e.preventDefault();
  const file = document.getElementById('submissionFileInput').files[0];
  const taskId = document.getElementById('selectedAssignmentId').value;
  const sessionData = localStorage.getItem('currentUser');
  const user = sessionData ? JSON.parse(sessionData) : null;

  if (!file || !user) {
    showToast('يُرجَى تسجيل الدخول واختيار الملف أولاً', 'error');
    return;
  }

  try {
    showToast('جاري رفع الواجب إلى الخادم...', 'info', 2000);

    // Upload submission to Supabase Storage
    const fileExt = file.name.split('.').pop();
    const filePath = `submissions/${user.username}_${taskId}_${Date.now()}.${fileExt}`;

    const { error } = await window.supabaseClient.storage
      .from('library_books')
      .upload(filePath, file);

    if (error) throw error;

    // Record submission record in Firestore
    await db.collection('submissions').add({
      assignmentId: taskId,
      username: user.username,
      studentName: user.name || user.username,
      filePath,
      submittedAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    closeSubmitModal();
    showToast('تم تسليم الواجب بنجاح! 🎉', 'success');

    // Refresh my submissions tab if currently open
    if (currentTab === 'mySubmissions') {
      loadMySubmissions();
    }
  } catch (err) {
    console.error('Submission error:', err);
    showToast('حدث خطأ أثناء رفع الواجب', 'error');
  }
}

function showToast(message, type = 'info', duration = 3500) {
  let container = document.getElementById('toastContainer');
  if (!container) {
    container = document.createElement('div');
    container.id = 'toastContainer';
    document.body.appendChild(container);
  }

  const toast = document.createElement('div');
  toast.className = `toast-message ${type}`;

  let iconSymbol = 'ℹ️';
  if (type === 'success') iconSymbol = '✓';
  if (type === 'error') iconSymbol = '✕';

  toast.innerHTML = `
    <div class="toast-icon">${iconSymbol}</div>
    <span class="toast-text">${message}</span>
  `;

  container.appendChild(toast);

  // Trigger animation frame
  setTimeout(() => toast.classList.add('show'), 10);

  // Auto remove after duration
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 300);
  }, duration);
}
