<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عرض التصنيف - المكتبة الرقمية</title>

  <link rel="icon" type="image/png" href="assets/images/web/haashiya_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700;800&family=Work+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
</head>

<body>
  <!-- NAVBAR -->
  <header class="navbar">
    <div class="navbar-container">
      <div class="navbar-left">
        <a href="index.html" class="logo-link" onclick="smoothNavigate(event, 'index.html')">
          <img src="assets/images/web/navbar_logo.png" alt="حاشية" class="navbar-logo">
        </a>
      </div>

      <div class="navbar-right">
        <a href="login.html" class="btn-login" onclick="smoothNavigate(event, 'login.html')">تسجيل الدخول</a>
        <button class="icon-btn" aria-label="Menu">
          <span class="dots-icon"></span>
        </button>
      </div>
    </div>
  </header>

  <main class="library-wrapper">
    <section class="main-card-section">
      <div class="section-header">
        <h2 id="categoryPageTitle" class="section-title">جميع الكتب</h2>
        <a href="index.html" class="view-all-link" onclick="smoothNavigate(event, 'index.html')">&rarr; العودة للرئيسية</a>
      </div>

      <!-- Book List Container -->
      <div id="categoryBooksContainer" class="book-list-container">
        <!-- Dynamic items render here -->
      </div>
    </section>
  </main>

  <!-- FOOTER AT THE VERY BOTTOM -->
  <footer class="site-footer">
    <div class="footer-overlay">
      <div class="footer-container">
        <img src="assets/images/web/footer_preview.png" alt="footer" class="footer-logo">
      </div>
    </div>
  </footer>

  <!-- LOGOUT MODAL -->
  <div id="logoutModal" class="logout-modal-overlay">
    <div class="logout-modal-card">
      <div class="logout-modal-icon">⚠️</div>
      <h3 class="logout-modal-title">تسجيل الخروج</h3>
      <p class="logout-modal-text">هل أنت تأكد من أنك تريد تسجيل الخروج؟</p>
      <div class="logout-modal-actions">
        <button class="logout-confirm-btn" onclick="confirmLogout()">نعم، تسجيل الخروج</button>
        <button class="logout-cancel-btn" onclick="closeLogoutModal()">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATIONS -->
  <div id="toastNotification" class="toast-notification">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
    <span>تمت العملية بنجاح!</span>
  </div>

  <div id="errorToastNotification" class="toast-notification toast-error">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
    <span id="errorToastMessage">حدث خطأ في المدخلات!</span>
  </div>

  <script>
    function smoothNavigate(event, targetUrl) {
      event.preventDefault();
      document.body.classList.add('fade-out');
      setTimeout(() => { window.location.href = targetUrl; }, 300);
    }

    // --- CHECK USER LOGIN SESSION & DROPDOWN ---
    function checkUserSession() {
      const sessionData = localStorage.getItem('currentUser');
      const navbarRight = document.querySelector('.navbar-right');

      if (sessionData && navbarRight) {
        const user = JSON.parse(sessionData);
        const isMale = user.gender === 'male';
        const genderLabel = isMale ? 'رجل ♂' : 'أنثى ♀';
        const genderClass = isMale ? 'gender-male' : 'gender-female';

        navbarRight.innerHTML = `
          <div class="user-profile-wrapper">
            <button class="user-profile-badge" onclick="toggleProfileDropdown(event)">
              <img src="${user.avatar}" alt="${user.name}" class="profile-avatar" onError="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}&background=1565c0&color=fff'">
              <div class="profile-info-group">
                <span class="profile-name">${user.name}</span>
                <span class="gender-badge ${genderClass}">${genderLabel}</span>
              </div>
              <svg class="dropdown-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>

            <div id="profileDropdown" class="profile-dropdown-menu">
              <a href="#" class="dropdown-item" onclick="event.preventDefault(); showErrorToast('صفحة الملف الشخصي قيد التطوير');">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                الملف الشخصي
              </a>
              <a href="#" class="dropdown-item" onclick="event.preventDefault(); showErrorToast('لا توجد إشعارات جديدة حالياً');">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                الإشعارات
                <span class="unread-badge">3</span>
              </a>
              <div class="dropdown-divider"></div>
              <button class="dropdown-item logout-item" onclick="logoutUser()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                تسجيل الخروج
              </button>
            </div>
          </div>
          <button class="icon-btn" aria-label="Menu"><span class="dots-icon"></span></button>
        `;
      }
    }

    function toggleProfileDropdown(e) {
      e.stopPropagation();
      const dropdown = document.getElementById('profileDropdown');
      if (dropdown) dropdown.classList.toggle('show');
    }

    document.addEventListener('click', (e) => {
      const dropdown = document.getElementById('profileDropdown');
      if (dropdown && dropdown.classList.contains('show')) dropdown.classList.remove('show');
    });

    function logoutUser() {
      const modal = document.getElementById('logoutModal');
      if (modal) modal.classList.add('show');
    }

    function closeLogoutModal() {
      const modal = document.getElementById('logoutModal');
      if (modal) modal.classList.remove('show');
    }

    function confirmLogout() {
      localStorage.removeItem('currentUser');
      location.reload();
    }

    function showErrorToast(msg) {
      const toast = document.getElementById('errorToastNotification');
      const span = document.getElementById('errorToastMessage');
      if (toast && span) {
        span.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3500);
      }
    }

    // Default Educational Books List
    const defaultEducationalBooks = [
      { title: "علم البديع دراسة تاريخية وفنية", author: "د. بسيوني عبد الفتاح فيود", meta: "المرجع الرئيسي - مادة البلاغة", cover: "assets/images/covers/badee3tareekh.png", pdf: "assets/pdfs/badee3tareekh.pdf" },
      { title: "البديع في ضوء أساليب القرآن", author: "د. عبد الفتاح لاشين", meta: "المرجع الرئيسي - مادة البلاغة", cover: "assets/images/covers/badee3_1.png", pdf: "assets/pdfs/badee3asaleeb.pdf" },
      { title: "المهارات اللغوية", author: "د. محمد صالح الشنطي", meta: "المرجع الرئيسي - مادة القراءة", cover: "assets/images/covers/maharat.png", pdf: "assets/pdfs/maharatlughawya.pdf" },
      { title: "الملخص في شرح كتاب التوحيد", author: "د. صالح بن فوزان بن عبدالله الفوزان", meta: "المرجع الرئيسي - مادة التوحيد", cover: "assets/images/covers/mulakhasktabtawheed.png", pdf: "assets/pdfs/mulakhasktabtawheed.pdf" },
      { title: "الإملاء و الترقيم", author: "أحمد محمد أبو بكر", meta: "المرجع الرئيسي - مادة الكتابة", cover: "assets/images/covers/imlatarqim.png", pdf: "assets/pdfs/imlatarqim.pdf" },
      { title: "شرح ابن عقيل على ألفية ابن مالك", author: "بهاء الدين عبدالله بن الرحمن بن عبدالله بن عقيل", meta: "المرجع الرئيسي - مادة النحو", cover: "assets/images/covers/sharhbn3qeel.png", pdf: "assets/pdfs/sharhbn3qeel.pdf" },
      { title: "الاختصار و التكميل لشرح ابن عقيل على ألفية ابن مالك", author: "د. مؤمن بن صبري غنام", meta: "المرجع الرئيسي - مادة النحو", cover: "assets/images/covers/ikhtisaribnaqeel.png", pdf: "assets/pdfs/ikhtisaribnaqeel.pdf" },
      { title: "الأدب العربي و تاريخه للسنة الأولى", author: "جامعة الإمام محمد بن سعود الإسلامية", meta: "المرجع الرئيسي - مادة تاريخ الأدب", cover: "assets/images/covers/adab3rby_1.png", pdf: "assets/pdfs/adab3rby_1.pdf" }
    ];

    // --- DETECT CATEGORY FROM URL & LOAD BOOKS ---
    document.addEventListener('DOMContentLoaded', () => {
      checkUserSession();

      const urlParams = new URLSearchParams(window.location.search);
      const category = urlParams.get('cat') || 'educational';
      const pageTitle = document.getElementById('categoryPageTitle');
      const container = document.getElementById('categoryBooksContainer');

      if (category === 'general') {
        pageTitle.textContent = 'جميع كتب المكتبة العامة';
        const approved = JSON.parse(localStorage.getItem('approvedBooksDB') || '[]');
        if (approved.length === 0) {
          container.innerHTML = '<p style="text-align:center; color:#94a3b8; font-size:0.9rem; padding:30px 0;">لا توجد كتب مضافة في المكتبة العامة حالياً</p>';
        } else {
          approved.forEach(book => {
            container.innerHTML += `
              <div class="book-row-card">
                <div class="book-row-right">
                  <img src="${book.coverUrl}" alt="${book.title}" class="book-row-cover">
                  <div class="book-row-details">
                    <h3 class="book-row-title">${book.title}</h3>
                    <p class="book-row-author">${book.author}</p>
                    <span class="book-row-meta">المكتبة العامة - الفن: ${book.theme}</span>
                  </div>
                </div>
                <div class="book-row-actions">
                  <a href="${book.pdfUrl}" target="_blank" class="action-icon-btn" title="قراءة">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                  </a>
                  <a href="${book.pdfUrl}" download="${book.title}.pdf" class="action-icon-btn" title="تحميل">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                  </a>
                </div>
              </div>
            `;
          });
        }
      } else {
        pageTitle.textContent = 'جميع كتب المواد التعليمية';
        container.innerHTML = '';
        defaultEducationalBooks.forEach(book => {
          container.innerHTML += `
            <div class="book-row-card">
              <div class="book-row-right">
                <img src="${book.cover}" alt="${book.title}" class="book-row-cover">
                <div class="book-row-details">
                  <h3 class="book-row-title">${book.title}</h3>
                  <p class="book-row-author">${book.author}</p>
                  <span class="book-row-meta">${book.meta}</span>
                </div>
              </div>
              <div class="book-row-actions">
                <a href="${book.pdf}" target="_blank" class="action-icon-btn" title="قراءة">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </a>
                <a href="${book.pdf}" download class="action-icon-btn" title="تحميل">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                </a>
              </div>
            </div>
          `;
        });
      }
    });
  </script>

  <!-- NOTIFICATIONS MODAL -->
<div id="notificationsModal" class="upload-modal-overlay">
  <div class="upload-modal-card notifications-modal-card">
    <button class="modal-close-x" onclick="closeNotificationsModal()">&times;</button>

    <div class="notifications-header">
      <h3 class="upload-modal-title">الإشعارات</h3>
      <button class="btn-clear-notifications" onclick="clearAllNotifications()">مسح الكل</button>
    </div>
    <p class="upload-modal-subtitle">سجل التحديثات وحالة طلبات إضافة الكتب</p>

    <div id="notificationsList" class="notifications-list-container">
      <!-- Dynamic notification cards render here -->
    </div>
  </div>
</div>

</body>
</html>
