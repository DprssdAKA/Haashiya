<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - المكتبة الرقمية</title>

  <link rel="icon" type="image/png" href="assets/images/web/haashiya_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700;800&family=Work+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

  <div class="login-card">
    <h2>مرحباً بك!</h2>
    <p class="subtitle">يُرجَى تسجيل الدخول باستخدام البيانات المزوَّدة لك</p>

    <form id="loginForm">
      <div class="input-group">
        <label for="username">اسم المستخدم</label>
        <input type="text" id="username" placeholder="أدخل اسم المستخدم" required autocomplete="off">
      </div>

      <div class="input-group">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
      </div>

      <button type="submit" class="login-btn">تسجيل الدخول</button>
      <div id="message" class="message"></div>
    </form>

    <a href="index.html#educational-materials" class="back-home-link" onclick="smoothNavigate(event, 'index.html#educational-materials')">
      &rarr; العودة للرئيسية
    </a>
  </div>

  <script>
    // Allowed users database (Keys MUST be lowercase)
    const allowedUsers = {
      "alif khaerul anam": { 
        name: "أليف خير الأنام", 
        gender: "male",
        avatar: "assets/images/web/default_avatar.png", 
        pass: "123" 
      },
      "sarah": { 
        name: "سارة", 
        gender: "female",
        avatar: "assets/images/web/default_avatar.png", 
        pass: "1" 
      },
      "john": { 
        name: "جون", 
        avatar: "assets/images/web/default_avatar.png", 
        pass: "welcome456" 
      }
    };
  
    const loginForm = document.getElementById('loginForm');
    const messageDiv = document.getElementById('message');
  
    loginForm.addEventListener('submit', function(e) {
      e.preventDefault();
  
      // Replaces multiple spaces with a single space and lowers case
      const usernameInput = document.getElementById('username').value
        .trim()
        .toLowerCase()
        .replace(/\s+/g, ' ');
  
      const passwordInput = document.getElementById('password').value.trim();
  
      // Check if user exists
      if (allowedUsers[usernameInput] && allowedUsers[usernameInput].pass === passwordInput) {
        const user = allowedUsers[usernameInput];
  
        // Store user session in LocalStorage
        localStorage.setItem('currentUser', JSON.stringify({
          username: usernameInput,
          name: user.name,
          gender: user.gender,
          avatar: user.avatar
        }));
  
        messageDiv.className = "message success";
        messageDiv.textContent = "تم تسجيل الدخول بنجاح! جاري التوجيه...";
  
        setTimeout(() => {
          document.body.classList.add('fade-out');
          setTimeout(() => {
            window.location.href = "index.html";
          }, 300);
        }, 1200);
  
      } else {
        messageDiv.className = "message error";
        messageDiv.textContent = "اسم المستخدم أو كلمة المرور غير صحيحة. يُرجَى المحاولة مرة أخرى";
      }
    });
  
    function smoothNavigate(event, targetUrl) {
      event.preventDefault();
      document.body.classList.add('fade-out');
      setTimeout(() => {
        window.location.href = targetUrl;
      }, 300);
    }
  </script>
  

</body>
</html>
