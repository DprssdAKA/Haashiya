<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - المكتبة الرقمية</title>

  <link rel="icon" type="image/png" href="assets/images/web/haashiya_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700;800&family=Work+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

  <div class="login-card">
    <h2>مرحباً بك!</h2>
    <p class="subtitle">يُرجَى تسجيل الدخول باستخدام البيانات المزوَّدة لك</p>

    <form id="loginForm">
      <div class="input-group">
        <label for="username">اسم المستخدم</label>
        <input type="text" id="username" placeholder="أدخل اسم المستخدم" required autocomplete="off">
      </div>

      <div class="input-group">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
      </div>

      <button type="submit" class="login-btn">تسجيل الدخول</button>
      <div id="message" class="message"></div>
    </form>

    <a href="index.html#educational-materials" class="back-home-link" onclick="smoothNavigate(event, 'index.html#educational-materials')">
      &rarr; العودة للرئيسية
    </a>
  </div>

  <script>
    // Load users array from data/users.json
    // Example using Firebase Realtime Database
    async function handleLoginSubmit(e) {
  e.preventDefault();
  
  const usernameInput = document.getElementById('usernameInput').value.trim().toLowerCase();
  const passwordInput = document.getElementById('passwordInput').value.trim();

  try {
    const db = firebase.firestore();
    const userDoc = await db.collection('users').doc(usernameInput).get();

    if (!userDoc.exists) {
      showErrorToast('اسم المستخدم غير مسجل بالمنظومة');
      return;
    }

    const userData = userDoc.data();
    
    // Fallback check to support either field
    const activePassword = userData.pass || userData.password;

    if (activePassword === passwordInput) {
      const userSession = {
        username: usernameInput,
        name: userData.name || 'المستخدم',
        email: userData.email || '',
        gender: userData.gender || 'male',
        role: userData.role || 'user',
        pass: activePassword,
        password: activePassword,
        avatar: userData.avatar || 'assets/images/web/default_avatar.png',
        studentId: userData.studentId || '11011110001'
      };

      localStorage.setItem('currentUser', JSON.stringify(userSession));
      showToastNotification('تم تسجيل الدخول بنجاح!');
      
      setTimeout(() => { window.location.href = 'index.html'; }, 800);
    } else {
      showErrorToast('كلمة المرور غير صحيحة!');
    }

  } catch (err) {
    console.error('Login Error:', err);
    showErrorToast('حدث خطأ أثناء تسجيل الدخول');
  }
}

    async function loadUsersData() {
      try {
        const response = await fetch('data/users.json');
        if (!response.ok) throw new Error('Failed to fetch users.json');
        return await response.json();
      } catch (error) {
        console.error('Error loading users JSON data:', error);
        return [];
      }
    }
  
    const loginForm = document.getElementById('loginForm');
    const messageDiv = document.getElementById('message');
  
    // Mark event listener as async to use fetch()
    loginForm.addEventListener('submit', async function(e) {
      e.preventDefault();
  
      const usernameInput = document.getElementById('username').value
        .trim()
        .toLowerCase()
        .replace(/\s+/g, ' ');
  
      const passwordInput = document.getElementById('password').value.trim();
  
      // Fetch users list from JSON
      const usersList = await loadUsersData();
  
      // Find matching user profile
      const matchedUser = usersList.find(u => 
        u.username.toLowerCase() === usernameInput && u.pass === passwordInput
      );
  
      if (matchedUser) {
        // Store user session in LocalStorage
        localStorage.setItem('currentUser', JSON.stringify({
          username: matchedUser.username,
          name: matchedUser.name,
          gender: matchedUser.gender,
          role: matchedUser.role,
          avatar: matchedUser.avatar
        }));
  
        messageDiv.className = "message success";
        messageDiv.textContent = "تم تسجيل الدخول بنجاح! جاري التوجيه...";
  
        setTimeout(() => {
          document.body.classList.add('fade-out');
          setTimeout(() => {
            window.location.href = "index.html";
          }, 300);
        }, 1200);
  
      } else {
        messageDiv.className = "message error";
        messageDiv.textContent = "اسم المستخدم أو كلمة المرور غير صحيحة. يُرجَى المحاولة مرة أخرى";
      }
    });
  
    function smoothNavigate(event, targetUrl) {
      event.preventDefault();
      document.body.classList.add('fade-out');
      setTimeout(() => {
        window.location.href = targetUrl;
      }, 300);
    }
  </script>
  
  

</body>
</html>
